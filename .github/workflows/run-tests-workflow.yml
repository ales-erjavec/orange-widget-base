name : Run tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONFAULTHANDLER: 1
      PIP_NO_PIP_VERSION_CHECK: 1
      PIP_CACHE_DIR: .pip-cache
      PIP_PREFER_BINARY: 1

    strategy:
      fail-fast: False
      matrix:
        include:
          # Linux
          - os: ubuntu-18.04
            python-version: 3.6
            test-env: "PyQt5~=5.9.2"

#          - os: ubuntu-18.04
#            python-version: 3.7
#            test-env: "PyQt5~=5.12.1 PyQtWebEngine~=5.12.1"
#
#          - os: ubuntu-20.04
#            python-version: 3.8
#            test-env: "PyQt5~=5.14.0 PyQtWebEngine~=5.14.0"
#
#          - os: ubuntu-20.04
#            python-version: 3.9
#            test-env: "PyQt5~=5.15.0 PyQtWebEngine~=5.15.0"
#
#          # macOS
#          - os: macos-10.15
#            python-version: 3.6
#            test-env: "PyQt5~=5.9.2"
#
#          - os: macos-10.15
#            python-version: 3.7
#            test-env: "PyQt5~=5.12.1 PyQtWebEngine~=5.12.1"
#
#          - os: macos-10.15
#            python-version: 3.8
#            test-env: "PyQt5~=5.14.0 PyQtWebEngine~=5.14.0"
#
#          - os: macos-10.15
#            python-version: 3.9
#            test-env: "PyQt5~=5.15.0 PyQtWebEngine~=5.15.0"
#
#          # Windows
#          - os: windows-2019
#            python-version: 3.6
#            test-env: "PyQt5~=5.9.2"
#
#          - os: windows-2019
#            python-version: 3.7
#            test-env: "PyQt5~=5.12.1 PyQtWebEngine~=5.12.1"
#
#          - os: windows-2019
#            python-version: 3.8
#            test-env: "PyQt5~=5.14.0 PyQtWebEngine~=5.14.0 pyqtgraph>=0.11a0"
#
#          - os: windows-2019
#            python-version: 3.9
#            test-env: "PyQt5~=5.15.0 PyQtWebEngine~=5.15.0 pyqtgraph>=0.11a0"
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Deps
        if: ${{ startsWith(runner.os, 'Linux') }}
        # https://www.riverbankcomputing.com/pipermail/pyqt/2020-June/042949.html
        run: |
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
          # sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxrandr2 libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2 libxi6 libxtst6

      - name: Setup Pip Cache
        uses: actions/cache@v2
        with:
          path: .pip-cache
          key: ${{ runner.os }}-py-${{ matrix.python-version }}-pip-${{ hashFiles('setup.*', '.github/workflows/run-tests-workflow.yml') }}
          restore-keys: |
            ${{ runner.os }}-py-${{ matrix.python-version }}-pip

      - name: Install Test Deps
        env:
          TEST_ENV: ${{ matrix.test-env }}
          TEST_DEPS: wheel coverage codecov
        run: python -m pip install $TEST_DEPS $TEST_ENV
        shell: bash

      - name: Install
        run: python -m pip install -e .

      - name: List Test Env
        run: pip list --format=freeze

      - name: Run Tests
        if: ${{ !startsWith(runner.os, 'Linux') }}
        run: coverage run -m unittest -v

#      - name: ls
#        run: ls -l /usr/lib/x86_64-linux-gnu/
      - name: nm
        run: nm -D /usr/lib/x86_64-linux-gnu/libgobject-2.0.so.0 | grep g_date_time_unref
      - name: ldd
        run: ldd /usr/lib/x86_64-linux-gnu/libgobject-2.0.so.0
      - name: nm
        run: nm -D /usr/lib/x86_64-linux-gnu/libglib-2.0.so.0 | grep g_date_time_unref
      - name: Run Tests with Xvfb
        if: ${{ startsWith(runner.os, 'Linux') }}
        env:
          XVFBARGS: "-screen 0 1280x1024x24"
          LD_DEBUG: "libs"
          PYTHONVERBOSE: "1"
          PYTHONUNBUFFERED: "1"
          LD_PRELOAD: "/lib/x86_64-linux-gnu/libgcc_s.so.1"
#        run: catchsegv xvfb-run -a -s "$XVFBARGS" coverage run -m unittest  -v
        run: python -c "import PyQt5.QtWidgets, PyQt5.QtWebEngineWidgets, matplotlib.pylab" # run -m unittest  -v

      - name: Upload Coverage
        run: codecov
